<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_mobile.css">
<style>
body { color: #E9F0EA; background: #070B09; position: relative; }
.pad { padding: 6px 20px; }
.back { font-size: 14px; color: #8C9A90; }
h1 { font: 700 38px/0.95 'Barlow Condensed'; text-transform: uppercase; margin-top: 16px; }
.card { margin: 16px 16px 0; padding: 18px; border-radius: 22px; background: #0D1410; border: 1px solid rgba(255,255,255,.07); }
.card small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8C9A90; font-weight: 700; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 170px; margin-top: 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.bars i { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, rgba(198,244,50,.5), rgba(198,244,50,.1)); }
.bars i.lead { background: linear-gradient(180deg,#C6F432,#6E9A10); }
.names { display: flex; gap: 8px; margin-top: 8px; font-size: 10px; color: #8C9A90; }
.names span { flex: 1; text-align: center; }
.fc { margin: 14px 16px 0; padding: 18px; border-radius: 22px; background: linear-gradient(140deg, rgba(198,244,50,.18), rgba(198,244,50,.03)); border: 1px solid rgba(198,244,50,.3); }
.fc small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #C6F432; font-weight: 700; }
.fc p { font: 700 24px/1.05 'Barlow Condensed'; text-transform: uppercase; margin-top: 8px; }
.clubs { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.clubs span { padding: 8px 12px; border-radius: 99px; background: rgba(255,255,255,.07); font-size: 13px; font-weight: 600; }
.m { display: flex; gap: 10px; margin: 14px 16px 0; }
.m div { flex: 1; padding: 14px; border-radius: 18px; background: #0D1410; border: 1px solid rgba(255,255,255,.07); font-size: 11px; color: #8C9A90; }
.m b { display: block; font: 700 28px 'Barlow Condensed'; color: #E9F0EA; margin-top: 4px; }
.home-bar { background: #E9F0EA; }
</style></head><body>
<div class="status"><span>9:41</span><i></i></div>
<div class="pad"><p class="back">‹ Table</p><h1>Forecast</h1></div>
<div class="card"><small>Matches won · all seasons</small>
<div class="bars"><i class="lead" style="height:100%"></i><i class="lead" style="height:86%"></i><i style="height:31%"></i><i style="height:21%"></i><i style="height:20%"></i><i style="height:15%"></i></div>
<div class="names"><span>CHE</span><span>LIV</span><span>SUN</span><span>CHA</span><span>LEI</span><span>LEE</span></div></div>
<div class="fc"><small>Most likely to dominate</small><p>Based on every club’s win history</p><div class="clubs"><span>Chelsea</span><span>Man United</span><span>Arsenal</span></div></div>
<div class="m"><div>MAE<b>31.97</b></div><div>RMSE<b>39.72</b></div></div>
<div class="home-bar"></div>
</body></html>
