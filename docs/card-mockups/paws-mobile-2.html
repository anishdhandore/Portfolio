<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="_mobile.css">
<style>
body { color: #FFF6D6; background: #1A1608; position: relative; }
.pad { padding: 10px 20px 0; }
.badge { display: inline-flex; gap: 6px; padding: 7px 12px; border-radius: 99px; background: rgba(229,72,77,.15); color: #FF8F92; font-size: 12px; font-weight: 600; border: 1px solid rgba(229,72,77,.35); }
h1 { font: 700 34px/1.04 Fraunces; letter-spacing: -.02em; margin-top: 14px; }
h1 em { font-style: normal; color: #F5B800; }
.form { margin: 18px 16px 0; padding: 18px; border-radius: 24px; background: #FFF9E8; color: #1A1608; display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: #5A5233; }
.in { border-radius: 12px; border: 1.5px solid #EADBA8; background: #fff; padding: 12px; font-size: 14px; color: #1A1608; font-weight: 500; }
.in.focus { border-color: #F5B800; box-shadow: 0 0 0 4px rgba(245,184,0,.2); }
.area { height: 84px; line-height: 1.45; }
.send { margin-top: 4px; padding: 15px; border-radius: 14px; background: #E5484D; color: #fff; text-align: center; font-weight: 700; font-size: 15px; box-shadow: 0 10px 24px rgba(229,72,77,.35); }
.note { text-align: center; font-size: 12px; color: #8A8158; }
.home-bar { background: #FFF6D6; }
</style></head><body>
<div class="status"><span>9:41</span><i></i></div>
<div class="pad"><span class="badge">● Emergency help</span><h1>Report it.<br><em>We’ll get help moving.</em></h1></div>
<div class="form">
<label>Your email<span class="in focus">anish@example.com</span></label>
<label>Where are you?<span class="in">San Marcos, CA</span></label>
<label>What did you see?<span class="in area">A dog left tied outside in the heat all day, with no water.</span></label>
<div class="send">Send report</div>
<p class="note">We’ll email you your nearest World Animal Protection office</p>
</div>
<div class="home-bar"></div>
</body></html>
