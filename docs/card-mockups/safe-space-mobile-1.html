<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="_mobile.css">
<style>
body { color: #0B1B26; background: radial-gradient(420px 300px at 50% 0%, rgba(18,198,240,.25), transparent 70%), #F5FBFD; position: relative; }
.top { display: flex; align-items: center; gap: 8px; padding: 8px 20px; font-weight: 800; font-size: 18px; letter-spacing: -.03em; }
.shield { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#12C6F0,#2E7CF6); display: grid; place-items: center; }
h1 { font-size: 36px; font-weight: 800; letter-spacing: -.045em; line-height: 1.02; padding: 18px 20px 0; }
h1 span { color: #12A9D6; }
.scan { margin: 18px 16px 0; padding: 8px; border-radius: 18px; background: #fff; box-shadow: 0 16px 40px rgba(18,120,160,.16), 0 0 0 1px #D6EEF5; }
.url { padding: 12px; font-size: 15px; font-weight: 500; }
.url small { color: #8AA3B1; font-weight: 400; }
.btn { padding: 14px; border-radius: 13px; background: linear-gradient(135deg,#12C6F0,#2E7CF6); color: #fff; text-align: center; font-weight: 700; }
.verdict { margin: 16px 16px 0; padding: 20px; border-radius: 24px; background: linear-gradient(160deg,#E9FBF2,#D6F5E6); border: 1px solid #B7EBD1; text-align: center; }
.ok { width: 72px; height: 72px; margin: 0 auto; border-radius: 22px; background: #18B96B; display: grid; place-items: center; box-shadow: 0 14px 28px rgba(24,185,107,.35); }
.verdict h2 { font-size: 24px; letter-spacing: -.03em; color: #0B4D2E; margin-top: 14px; }
.verdict p { font-size: 13px; color: #2F7A55; margin-top: 4px; }
.stats { display: flex; gap: 10px; margin: 14px 16px 0; }
.stats div { flex: 1; padding: 14px; border-radius: 18px; background: #fff; border: 1px solid #DDEFF5; font-size: 11px; color: #8AA3B1; font-weight: 600; }
.stats b { display: block; font-size: 24px; color: #0B1B26; letter-spacing: -.03em; margin-top: 4px; }
.home-bar { background: #0B1B26; }
</style></head><body>
<div class="status"><span>9:41</span><i></i></div>

<h1>Is this page <span>safe for kids?</span></h1>
<div class="scan"><div class="url"><small>https://</small>kids.nationalgeographic.com</div><div class="btn">Scan page</div></div>
<div class="verdict"><div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>Safe for kids</h2><p>No inappropriate language found</p></div>
<div class="stats"><div>Flagged words<b>0</b></div><div>Result<b>Cached</b></div></div>
<div class="home-bar"></div>
</body></html>
