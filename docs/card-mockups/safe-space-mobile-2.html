<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="_mobile.css">
<style>
body { color: #0B1B26; background: #F5FBFD; position: relative; }
.pad { padding: 10px 20px 0; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -.04em; }
.sub { font-size: 13px; color: #557082; margin-top: 4px; }
.seg { display: flex; gap: 6px; margin-top: 16px; }
.seg span { padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; background: #fff; border: 1px solid #DDEFF5; color: #557082; }
.seg span.on { background: #0B1B26; color: #fff; }
.alert { margin: 16px 16px 0; padding: 18px; border-radius: 22px; background: linear-gradient(160deg,#FFF1F1,#FDE3E3); border: 1px solid #F6C6C6; }
.alert small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #C93636; }
.alert h2 { font-size: 20px; letter-spacing: -.02em; margin-top: 6px; color: #5C1414; }
.alert p { font-size: 13px; color: #9A3A3A; margin-top: 4px; }
.alert b { font-size: 40px; letter-spacing: -.04em; color: #C93636; display: block; margin-top: 8px; }
.list { margin: 14px 16px 0; border-radius: 22px; background: #fff; border: 1px solid #DDEFF5; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #EEF6F9; font-size: 14px; font-weight: 500; }
.row:last-child { border: 0; }
.fav { width: 30px; height: 30px; border-radius: 9px; background: #E6F6FB; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #2A8FB0; flex-shrink: 0; }
.row span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ok, .bad { padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.ok { background: #E3F8EE; color: #138A51; } .bad { background: #FDECEC; color: #C93636; }
.home-bar { background: #0B1B26; }
</style></head><body>
<div class="status"><span>9:41</span><i></i></div>
<div class="pad"><h1>History</h1><p class="sub">Cached verdicts, instant on repeat</p>
<div class="seg"><span class="on">All</span><span>Safe</span><span>Flagged</span></div></div>
<div class="alert"><small>Flagged</small><h2>genius.com/…family-reunion-lyrics</h2><p>Not suitable for children</p><b>50 words</b></div>
<div class="list">
<div class="row"><i class="fav">N</i><span>kids.nationalgeographic.com</span><em class="ok">Safe</em></div>
<div class="row"><i class="fav">O</i><span>ourartistic.space</span><em class="ok">Safe</em></div>
<div class="row"><i class="fav">N</i><span>nasa.gov/kids</span><em class="ok">Safe</em></div>
</div>
<div class="home-bar"></div>
</body></html>
