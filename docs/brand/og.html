<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#0a0a0b;color:#f4f4f2;font-family:Inter,sans-serif;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:-30% 30% auto -10%;height:90%;background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent)}
.top{position:absolute;left:80px;right:80px;top:64px;display:flex;justify-content:space-between;align-items:center;font-size:22px;color:rgba(244,244,242,.55)}
.live{display:flex;align-items:center;gap:12px}.live i{width:12px;height:12px;border-radius:50%;background:#1f9d55}
.eyes{display:flex;gap:10px}.eye{width:44px;height:52px;border-radius:50%;background:#f4f4f2;position:relative}
.eye i{position:absolute;left:50%;top:56%;width:20px;height:20px;border-radius:50%;background:#0a0a0b;transform:translate(-30%,-50%)}
h1{position:absolute;left:80px;bottom:150px;margin:0;font-family:'Inter Tight';font-weight:500;font-size:82px;line-height:1;letter-spacing:-.045em;max-width:980px}
h1 span{color:rgba(244,244,242,.42)}
.name{position:absolute;left:80px;bottom:72px;font-size:28px;font-weight:500}
.name em{font-style:normal;color:rgba(244,244,242,.5);font-weight:400;margin-left:14px}
</style></head><body>
<div class="top"><div class="eyes"><div class="eye"><i></i></div><div class="eye"><i></i></div></div><div class="live"><i></i>Open to new roles and projects</div></div>
<h1>Software Engineer <span>building</span> AI products <span>that people</span> actually use.</h1>
<div class="name">Anish Dhandore<em>anishdhandore.com</em></div>
</body></html>
