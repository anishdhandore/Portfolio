<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;background:#0e0e10}
.wrap{width:512px;height:512px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a2a30,#0e0e10 70%)}
.eyes{display:flex;gap:30px}
.eye{width:130px;height:152px;border-radius:50%;background:#f4f4f2;position:relative}
.eye i{position:absolute;left:50%;top:56%;width:60px;height:60px;border-radius:50%;background:#0e0e10;transform:translate(-30%,-50%)}
.eye i::after{content:'';position:absolute;left:12px;top:10px;width:16px;height:16px;border-radius:50%;background:#f4f4f2}
</style></head><body><div class="wrap"><div class="eyes"><div class="eye"><i></i></div><div class="eye"><i></i></div></div></div></body></html>
